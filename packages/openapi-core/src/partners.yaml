openapi: 3.1.0
info:
  title: Partners API
  version: 0.1.0
  description: |
    Ecosystem partner graph for concentration and criticality scoring (BR-5).
  license:
    name: Proprietary
    url: https://morphora.local/license
  x-domain: prt
servers:
  - url: https://api.morphora.local
    description: Local / starter API
security:
  - apiKey: []
tags:
  - name: Partners
    description: Ecosystem partner graph
paths:
  /v0/tenants/me/partners:
    get:
      operationId: listPartners
      tags: [Partners]
      summary: List ecosystem partners
      responses:
        '200':
          description: Partners
          content:
            application/json:
              schema:
                $ref: ./partners.schemas.yaml#/components/schemas/PartnerListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createPartner
      tags: [Partners]
      summary: Create an ecosystem partner
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./partners.schemas.yaml#/components/schemas/PartnerCreateRequest
      responses:
        '201':
          description: Partner created
          content:
            application/json:
              schema:
                $ref: ./partners.schemas.yaml#/components/schemas/PartnerResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v0/tenants/me/partners/{partnerId}:
    get:
      operationId: getPartner
      tags: [Partners]
      summary: Get an ecosystem partner
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            $ref: ./partners.schemas.yaml#/components/schemas/PartnerId
      responses:
        '200':
          description: Partner
          content:
            application/json:
              schema:
                $ref: ./partners.schemas.yaml#/components/schemas/PartnerResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v0/tenants/me/partners/{partnerId}/criticality:
    put:
      operationId: setPartnerCriticality
      tags: [Partners]
      summary: Set partner criticality and concentration
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            $ref: ./partners.schemas.yaml#/components/schemas/PartnerId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./partners.schemas.yaml#/components/schemas/CriticalityUpdateRequest
      responses:
        '200':
          description: Criticality updated
          content:
            application/json:
              schema:
                $ref: ./partners.schemas.yaml#/components/schemas/PartnerResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
